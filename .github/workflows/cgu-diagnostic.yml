name: Diagnosticar conexao CGU
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Testar autenticação e consulta sem revelar o segredo
        env:
          TRANSPARENCIA_API_KEY: ${{ secrets.TRANSPARENCIA_API_KEY }}
        shell: python
        run: |
          import os, json, time
          from datetime import datetime, timedelta, timezone
          from urllib.request import Request, build_opener, HTTPRedirectHandler
          from urllib.error import HTTPError, URLError
          from urllib.parse import urlencode

          class NoRedirect(HTTPRedirectHandler):
              def redirect_request(self, *args, **kwargs):
                  return None

          key = os.environ.get('TRANSPARENCIA_API_KEY', '').strip()
          if not key:
              print('RESULTADO: segredo ausente ou vazio.')
              raise SystemExit(1)
          if any(ord(c) < 33 or ord(c) > 126 for c in key):
              print('RESULTADO: segredo contém caracteres incompatíveis com um cabeçalho HTTP. Valor não exibido.')
              raise SystemExit(1)
          today = datetime.now(timezone(timedelta(hours=-3))).date()
          cases = [
              ('Autenticação em emendas', 'emendas', {'ano': today.year, 'pagina': 1}),
              *[(f'Despesas fase {phase}, gestão 00001', 'despesas/documentos', {'dataEmissao': (today-timedelta(days=1)).strftime('%d/%m/%Y'), 'fase': phase, 'gestao': '00001', 'pagina': 1}) for phase in (1, 2, 3)]
          ]
          report = ['# Diagnóstico CGU', '', 'A chave e o conteúdo das respostas não são registrados.', '']
          failed = False
          for label, endpoint, params in cases:
              request = Request('https://api.portaldatransparencia.gov.br/api-de-dados/' + endpoint + '?' + urlencode(params),
                  headers={'chave-api-dados': key, 'Accept': 'application/json', 'User-Agent': 'ObservatorioBrasil/0.3'})
              try:
                  with build_opener(NoRedirect()).open(request, timeout=40) as response:
                      raw = response.read(2_000_001)
                      if len(raw) > 2_000_000:
                          raise ValueError('limite')
                      payload = json.loads(raw)
                      if not isinstance(payload, list):
                          raise ValueError('formato')
                      result = f'HTTP {response.status}; lista válida; {len(payload)} registros na primeira página.'
              except HTTPError as exc:
                  explanations = {400: 'Consulta rejeitada: conferir filtros obrigatórios.',
                      401: 'Autenticação não aceita.', 403: 'Acesso negado: chave ou política de acesso do serviço.',
                      404: 'Endpoint não encontrado.', 429: 'Limite de consultas atingido.'}
                  result = f'HTTP {exc.code}; ' + explanations.get(exc.code, 'Resposta HTTP inesperada do serviço.')
                  failed = True
              except (URLError, TimeoutError):
                  result = 'Falha de rede ou tempo limite; não prova chave inválida.'
                  failed = True
              except Exception:
                  result = 'Resposta incompatível; conteúdo omitido.'
                  failed = True
              line = label + ': ' + result
              print(line, flush=True)
              report.append('- ' + line)
              time.sleep(2)
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
              summary.write('\n'.join(report) + '\n')
          if not failed:
              import tempfile, sys
              sys.path.insert(0, os.getcwd())
              from observatorio.core import connect
              from observatorio.sources import collect_cgu
              with tempfile.TemporaryDirectory() as folder:
                  db = connect(folder + '/probe.sqlite3')
                  try:
                      collect_cgu(db, str(today-timedelta(days=1)), pages=1)
                      count = db.execute('SELECT count(*) FROM resource_latest').fetchone()[0]
                      print(f'Coletor real: {count} registros preservados no banco temporário de teste.')
                      with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as summary:
                          summary.write(f'\nColetor real validado: {count} registros no banco temporário de teste.\n')
                  except Exception:
                      print('Coletor real falhou; consulte o código HTTP seguro acima.')
                      failed = True
                  finally:
                      db.close()
          raise SystemExit(1 if failed else 0)
