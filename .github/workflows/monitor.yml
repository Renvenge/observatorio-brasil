name: Monitorar contratos
on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
permissions:
  contents: read
concurrency:
  group: monitor-pncp
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - name: Recuperar histórico disponível
        uses: actions/cache/restore@v4
        with:
          path: data
          key: pncp-history-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: pncp-history-
      - name: Coletar janela recente e analisar
        run: python monitor.py --once --lookback-days 7
      - name: Guardar histórico para o próximo ciclo
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data
          key: pncp-history-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Disponibilizar relatórios desta execução
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-pncp-${{ github.run_id }}-${{ github.run_attempt }}
          path: reports/
          retention-days: 30
          if-no-files-found: warn
